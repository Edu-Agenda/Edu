<!DOCTYPE html>
<!--
=====================================================
    DOCUMENTACIÓN GENERAL DEL SISTEMA
=====================================================

    Archivo: calificaciones.html
    Proyecto: EduAgenda
    Módulo: Calificaciones y seguimiento de tareas
    Descripción:
    Esta interfaz permite a los profesores:

    ✔ Ver tareas entregadas
    ✔ Calificar estudiantes
    ✔ Agregar comentarios
    ✔ Filtrar información
    ✔ Visualizar estadísticas
    ✔ Consultar estados de entrega

=====================================================
-->

<html lang="es">

<head>

    <!-- =====================================================
         CONFIGURACIÓN BÁSICA DEL DOCUMENTO
    ====================================================== -->

    <!-- Permite caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Hace la página responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la pestaña -->
    <title>EduAgenda — Calificaciones</title>

    <!-- =====================================================
         FUENTES GOOGLE
    ====================================================== -->

    <!--
        DM Sans:
        Fuente principal del sistema
    -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <!-- Librería de íconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- =====================================================
         ESTILOS CSS
    ====================================================== -->

    <style>

        /* =====================================================
           VARIABLES GLOBALES DEL SISTEMA
        ====================================================== */

        :root {

            /* Colores principales */
            --ink: #0f172a;
            --ink-soft: #475569;
            --ink-ghost: #94a3b8;

            /* Fondos */
            --bg: #f8fafc;
            --surface: #ffffff;

            /* Bordes */
            --border: #e2e8f0;
            --border-strong: #cbd5e1;

            /* Color principal */
            --accent: #4f46e5;
            --accent-bg: #eef2ff;

            /* Verde */
            --green: #059669;
            --green-bg: #d1fae5;

            /* Amarillo */
            --amber: #b45309;
            --amber-bg: #fef3c7;

            /* Rojo */
            --red: #dc2626;
            --red-bg: #fee2e2;

            /* Bordes redondeados */
            --radius: 12px;
            --radius-sm: 8px;
        }

        /* =====================================================
           RESET GENERAL
        ====================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =====================================================
           BODY
        ====================================================== */

        body {

            /* Fuente principal */
            font-family: 'DM Sans', sans-serif;

            /* Fondo general */
            background: var(--bg);

            /* Color del texto */
            color: var(--ink);

            /* Altura mínima */
            min-height: 100vh;
        }

        /* =====================================================
           NAVBAR
        ====================================================== */

        nav {

            background: var(--surface);

            border-bottom: 1px solid var(--border);

            padding: 0 2rem;

            height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        /* Logo */
        .logo {

            font-size: 1.15rem;

            font-weight: 700;

            color: var(--accent);

            letter-spacing: -0.3px;
        }

        /* Links del menú */
        .nav-links {

            display: flex;

            align-items: center;

            gap: 1.5rem;
        }

        /* Estilos de enlaces */
        .nav-links a {

            text-decoration: none;

            color: var(--ink-soft);

            font-size: 0.875rem;

            font-weight: 500;

            transition: color 0.15s;
        }

        /* Hover y activo */
        .nav-links a:hover,
        .nav-links a.active {

            color: var(--accent);
        }

        /* Chip del usuario */
        .user-chip {

            display: flex;

            align-items: center;

            gap: 8px;

            background: var(--accent-bg);

            border: 1px solid #c7d2fe;

            padding: 5px 14px;

            border-radius: 50px;

            font-size: 0.85rem;

            font-weight: 600;

            color: var(--accent);
        }

        /* =====================================================
           CONTENEDOR GENERAL
        ====================================================== */

        .page {

            max-width: 1200px;

            margin: 0 auto;

            padding: 2rem 1.5rem;
        }

        /* =====================================================
           ENCABEZADO DE LA PÁGINA
        ====================================================== */

        .page-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            margin-bottom: 1.75rem;
        }

        /* Título principal */
        .page-header h1 {

            font-size: 1.5rem;

            font-weight: 700;

            letter-spacing: -0.3px;
        }

        /* Texto descriptivo */
        .page-header p {

            color: var(--ink-soft);

            font-size: 0.9rem;

            margin-top: 4px;
        }

        /* =====================================================
           TARJETAS DE ESTADÍSTICAS
        ====================================================== */

        .stats-row {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 1rem;

            margin-bottom: 1.5rem;
        }

        /* Tarjeta individual */
        .stat-card {

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 1.1rem 1.25rem;

            display: flex;

            align-items: center;

            gap: 1rem;
        }

        /* Ícono */
        .stat-icon {

            width: 40px;

            height: 40px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1rem;

            flex-shrink: 0;
        }

        /* Colores personalizados */
        .stat-icon.total {
            background: #ede9fe;
            color: #7c3aed;
        }

        .stat-icon.done {
            background: var(--green-bg);
            color: var(--green);
        }

        .stat-icon.pending {
            background: var(--amber-bg);
            color: var(--amber);
        }

        /* Número principal */
        .stat-num {

            font-size: 1.6rem;

            font-weight: 700;

            line-height: 1;

            letter-spacing: -1px;
        }

        /* Texto */
        .stat-label {

            font-size: 0.78rem;

            color: var(--ink-soft);

            margin-top: 3px;

            font-weight: 500;
        }

        /* =====================================================
           FILTROS
        ====================================================== */

        .filters {

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 1.1rem 1.25rem;

            display: flex;

            gap: 1rem;

            align-items: flex-end;

            margin-bottom: 1.5rem;

            flex-wrap: wrap;
        }

        /* Grupo filtro */
        .filter-item {

            display: flex;

            flex-direction: column;

            gap: 5px;

            flex: 1;

            min-width: 180px;
        }

        /* Label */
        .filter-item label {

            font-size: 0.75rem;

            font-weight: 600;

            color: var(--ink-soft);

            text-transform: uppercase;

            letter-spacing: 0.04em;
        }

        /* Inputs y selects */
        .filter-item select,
        .filter-item input {

            padding: 0.55rem 0.75rem;

            border: 1px solid var(--border-strong);

            border-radius: var(--radius-sm);

            font-family: inherit;

            font-size: 0.875rem;

            color: var(--ink);

            background: var(--bg);

            outline: none;

            transition: border-color 0.15s;
        }

        /* Focus */
        .filter-item select:focus,
        .filter-item input:focus {

            border-color: var(--accent);
        }

        /* =====================================================
           TABLA
        ====================================================== */

        .table-wrap {

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            overflow: hidden;
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        /* Encabezado */
        thead th {

            background: #f8fafc;

            padding: 0.85rem 1rem;

            font-size: 0.72rem;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.06em;

            color: var(--ink-soft);

            border-bottom: 1px solid var(--border);

            white-space: nowrap;
        }

        /* Filas */
        tbody tr {

            border-bottom: 1px solid var(--border);

            transition: background 0.1s;
        }

        tbody tr:last-child {

            border-bottom: none;
        }

        tbody tr:hover {

            background: #fafbfc;
        }

        /* Celdas */
        td {

            padding: 1rem;

            vertical-align: middle;

            font-size: 0.875rem;
        }

        /* =====================================================
           BADGES
        ====================================================== */

        .badge {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 3px 9px;

            border-radius: 20px;

            font-size: 0.72rem;

            font-weight: 600;
        }

        /* Estados */
        .badge-entregada {

            background: var(--green-bg);

            color: var(--green);
        }

        .badge-pendiente {

            background: var(--amber-bg);

            color: var(--amber);
        }

        .badge-calificada {

            background: var(--accent-bg);

            color: var(--accent);
        }

        /* =====================================================
           TAG MATERIA
        ====================================================== */

        .materia-tag {

            display: inline-block;

            background: var(--accent-bg);

            color: var(--accent);

            font-size: 0.7rem;

            font-weight: 700;

            padding: 2px 8px;

            border-radius: 6px;

            margin-bottom: 4px;

            font-family: 'DM Mono', monospace;
        }

        /* =====================================================
           CAJA ENTREGA
        ====================================================== */

        .entrega-box {

            background: #f8fafc;

            border-left: 3px solid var(--accent);

            padding: 8px 10px;

            border-radius: 6px;

            font-size: 0.8rem;

            color: var(--ink-soft);

            margin-top: 6px;

            max-width: 280px;
        }

        /* =====================================================
           INPUT NOTA
        ====================================================== */

        .nota-input {

            width: 72px;

            padding: 7px;

            border: 2px solid var(--border-strong);

            border-radius: var(--radius-sm);

            text-align: center;

            font-weight: 700;

            font-family: 'DM Mono', monospace;

            font-size: 1rem;

            color: var(--accent);

            background: var(--surface);

            outline: none;

            transition: border-color 0.15s;
        }

        .nota-input:focus {

            border-color: var(--accent);
        }

        /* =====================================================
           OBSERVACIONES
        ====================================================== */

        .obs-input {

            width: 100%;

            min-width: 160px;

            padding: 7px 10px;

            border: 1px solid var(--border-strong);

            border-radius: var(--radius-sm);

            font-family: inherit;

            font-size: 0.825rem;

            resize: vertical;

            outline: none;

            transition: border-color 0.15s;
        }

        .obs-input:focus {

            border-color: var(--accent);
        }

        /* =====================================================
           BOTÓN GUARDAR
        ====================================================== */

        .btn-save {

            width: 36px;

            height: 36px;

            background: var(--accent);

            color: white;

            border: none;

            border-radius: var(--radius-sm);

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 0.875rem;

            transition: background 0.15s, transform 0.1s;
        }

        .btn-save:hover:not(:disabled) {

            background: #4338ca;

            transform: scale(1.05);
        }

        .btn-save:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }

        /* =====================================================
           ESTADOS VACÍOS
        ====================================================== */

        .empty-state {

            padding: 3.5rem 2rem;

            text-align: center;

            color: var(--ink-ghost);
        }

        .empty-state i {

            font-size: 2rem;

            margin-bottom: 0.75rem;

            display: block;
        }

        .empty-state p {

            font-size: 0.9rem;
        }

        /* =====================================================
           CARGANDO
        ====================================================== */

        .loading-row td {

            text-align: center;

            padding: 3rem;

            color: var(--ink-soft);
        }

        /* =====================================================
           TOAST
        ====================================================== */

        #toast {

            position: fixed;

            bottom: 1.5rem;

            right: 1.5rem;

            background: var(--ink);

            color: white;

            padding: 0.75rem 1.2rem;

            border-radius: var(--radius-sm);

            font-size: 0.875rem;

            font-weight: 500;

            display: flex;

            align-items: center;

            gap: 8px;

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);

            transform: translateY(80px);

            opacity: 0;

            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

            z-index: 999;
        }

        /* Mostrar toast */
        #toast.show {

            transform: translateY(0);

            opacity: 1;
        }

        /* Toast éxito */
        #toast.ok {

            background: #065f46;
        }

        /* Toast error */
        #toast.err {

            background: #991b1b;
        }

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 768px) {

            .stats-row {

                grid-template-columns: 1fr;
            }

            .filters {

                flex-direction: column;
            }

            .nav-links {

                display: none;
            }

            td {

                padding: 0.75rem 0.6rem;
            }
        }

    </style>
</head>

<body>

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav>

        <!-- Logo -->
        <div class="logo">
            EduAgenda
        </div>

        <!-- Menú -->
        <div class="nav-links">

            <a href="profesor.html">
                Dashboard
            </a>

            <a href="calificaciones.html" class="active">
                Calificaciones
            </a>

            <a href="seguridad.html">
                Seguridad
            </a>

            <!-- Usuario -->
            <div class="user-chip">

                <i class="fa-solid fa-circle-user"></i>

                <span id="userNameDisplay">
                    Cargando...
                </span>

            </div>

        </div>

    </nav>

    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ====================================================== -->

    <div class="page">

        <!-- Encabezado -->
        <div class="page-header">

            <div>

                <h1>
                    Seguimiento de Tareas
                </h1>

                <p>
                    Revisa entregas, asigna notas y deja comentarios a tus estudiantes
                </p>

            </div>

        </div>

        <!-- =====================================================
             TARJETAS ESTADÍSTICAS
        ====================================================== -->

        <div class="stats-row">

            <!-- Total tareas -->
            <div class="stat-card">

                <div class="stat-icon total">
                    <i class="fa-solid fa-list-check"></i>
                </div>

                <div>

                    <div class="stat-num" id="statTotal">
                        —
                    </div>

                    <div class="stat-label">
                        Tareas totales
                    </div>

                </div>

            </div>

            <!-- Entregadas -->
            <div class="stat-card">

                <div class="stat-icon done">
                    <i class="fa-solid fa-circle-check"></i>
                </div>

                <div>

                    <div class="stat-num" id="statEntregadas">
                        —
                    </div>

                    <div class="stat-label">
                        Entregadas
                    </div>

                </div>

            </div>

            <!-- Pendientes -->
            <div class="stat-card">

                <div class="stat-icon pending">
                    <i class="fa-solid fa-clock"></i>
                </div>

                <div>

                    <div class="stat-num" id="statPendientes">
                        —
                    </div>

                    <div class="stat-label">
                        Sin calificar
                    </div>

                </div>

            </div>

        </div>

        <!-- =====================================================
             FILTROS
        ====================================================== -->

        <div class="filters">

            <!-- Materia -->
            <div class="filter-item">

                <label>
                    <i class="fa-solid fa-book"></i>
                    &nbsp;Materia
                </label>

                <select id="materiaSelect">

                    <option value="">
                        Todas las materias
                    </option>

                </select>

            </div>

            <!-- Estado -->
            <div class="filter-item">

                <label>
                    <i class="fa-solid fa-filter"></i>
                    &nbsp;Estado
                </label>

                <select id="estadoFilter">

                    <option value="todos">Todos</option>

                    <option value="completada">
                        Entregadas
                    </option>

                    <option value="pendiente">
                        Pendientes
                    </option>

                    <option value="calificada">
                        Calificadas
                    </option>

                </select>

            </div>

            <!-- Buscar -->
            <div class="filter-item">

                <label>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    &nbsp;Buscar estudiante
                </label>

                <input
                    type="text"
                    id="busquedaEstudiante"
                    placeholder="Nombre del estudiante...">

            </div>

        </div>

        <!-- =====================================================
             TABLA DE CALIFICACIONES
        ====================================================== -->

        <div class="table-wrap">

            <table>

                <!-- Encabezados -->
                <thead>

                    <tr>

                        <th style="width:18%">
                            Estudiante
                        </th>

                        <th style="width:28%">
                            Tarea / Entrega
                        </th>

                        <th style="width:10%">
                            Estado
                        </th>

                        <th style="width:9%">
                            Nota
                        </th>

                        <th style="width:24%">
                            Comentario
                        </th>

                        <th style="width:6%"></th>

                    </tr>

                </thead>

                <!-- Cuerpo -->
                <tbody id="calificacionesBody">

                    <!-- Cargando -->
                    <tr class="loading-row">

                        <td colspan="6">

                            <i class="fa-solid fa-spinner fa-spin"></i>

                            &nbsp;Cargando tareas...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- =====================================================
         TOAST NOTIFICACIONES
    ====================================================== -->

    <div id="toast"></div>

    <!-- =====================================================
         SCRIPT JS
    ====================================================== -->

    <!-- Archivo JavaScript principal -->
    <script src="js/calificaciones.js"></script>

</body>

</html>

<!-- Documento HTML5 -->
<!DOCTYPE html>

<!-- Idioma principal del sistema -->
<html lang="es">

<head>

    <!-- Configuración de caracteres -->
    <meta charset="UTF-8">

    <!-- Diseño responsive para celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Agenda del Profesor · EduAgenda</title>

    <!-- Librería de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =====================================================
           VARIABLES GLOBALES DEL SISTEMA
           Colores reutilizables en toda la interfaz
        ====================================================== */
        :root {
            --blue: #0061ff;
            --blue-dark: #0040cc;
            --bg: #f5f7fb;
            --border: #dbe3ef;
            --text: #1e293b;
        }

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ====================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =====================================================
           ESTILOS DEL BODY
           Define fuente y color principal del sistema
        ====================================================== */
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* =====================================================
           NAVBAR PRINCIPAL
           Barra superior de navegación
        ====================================================== */
        nav {
            background: white;
            padding: 14px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo del sistema */
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--blue);
        }

    </style>

</head>

<body>

<!-- =====================================================
     BARRA DE NAVEGACIÓN
===================================================== -->
<nav>

    <!-- Logo del sistema -->
    <div class="logo">
        <i class="fas fa-graduation-cap"></i>
        EduAgenda
    </div>

    <!-- Menú principal -->
    <div class="nav-links">

        <!-- Enlace hacia inicio -->
        <a href="profesor.html">Inicio</a>

        <!-- Página actual -->
        <a href="agenda.html" class="active">Agenda</a>

    </div>

</nav>

<!-- =====================================================
     CONTENIDO PRINCIPAL
===================================================== -->
<div class="container">

    <!-- Encabezado de la agenda -->
    <div class="top-section">

        <!-- Título principal -->
        <h1>Agenda de Clases</h1>

        <!-- Botón para abrir modal -->
        <button class="btn-new" onclick="abrirModalNuevo()">

            <!-- Icono -->
            <i class="fas fa-plus"></i>

            <!-- Texto -->
            Nuevo Horario

        </button>

    </div>

</div>

<script>

    /* =====================================================
       URL PRINCIPAL DEL BACKEND
       Servidor donde se realizan las peticiones
    ====================================================== */
    const API = 'http://localhost:3000';

    /* =====================================================
       TOKEN DE AUTENTICACIÓN
       Se obtiene desde LocalStorage
    ====================================================== */
    const token = localStorage.getItem('token') || '';

    /* =====================================================
       FUNCIÓN: verificarSesion()
       Verifica si el usuario tiene sesión iniciada
    ====================================================== */
    async function verificarSesion() {

        // Si no existe token, termina la función
        if (!token) return;

        try {

            // Petición al servidor para validar sesión
            const res = await fetch(`${API}/verificar`, {

                // Envío del token JWT
                headers: {
                    'Authorization': 'Bearer ' + token
                }

            });

            // Si la respuesta es correcta
            if (res.ok) {

                // Convertir respuesta a JSON
                const data = await res.json();

                // Mostrar usuario en consola
                console.log(data);

            }

        } catch(error) {

            // Mostrar error en consola
            console.error(error);

        }

    }

    /* =====================================================
       FUNCIÓN: cargarAgenda()
       Obtiene los horarios desde la API
    ====================================================== */
    async function cargarAgenda() {

        try {

            // Consumir endpoint de horarios
            const res = await fetch(`${API}/api/horarios`);

            // Convertir respuesta a JSON
            const horarios = await res.json();

            // Mostrar horarios en consola
            console.log(horarios);

        } catch(error) {

            // Error de conexión
            console.error(error);

        }

    }

    /* =====================================================
       INICIO DEL SISTEMA
       Ejecuta funciones al cargar la página
    ====================================================== */
    (async function() {

        // Verificar sesión
        await verificarSesion();

        // Cargar agenda
        await cargarAgenda();

    })();

</script>

</body>
</html>

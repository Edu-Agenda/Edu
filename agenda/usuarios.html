<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAgenda - Listado de Usuarios</title>
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <header class="topbar">
        <div class="logo-dashboard">
            <i class="fas fa-home"></i> EduAgenda
        </div>
        <div class="user-info">
            <i class="fas fa-bell"></i> <span>Estefania Quiñones</span>
            <button id="btnLogout" class="btn-logout"><i class="fas fa-user"></i> Cerrar sesión</button>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <nav>
                <a href="#"><i class="fas fa-home"></i> Inicio</a>
                <a href="#" class="active"><i class="fas fa-users"></i> Usuarios</a>
                <a href="#"><i class="fas fa-calendar-alt"></i> Disponibilidad</a>
                <a href="#"><i class="fas fa-book"></i> Agenda</a>
                <a href="#"><i class="fas fa-dollar-sign"></i> Pagos</a>
                <a href="#"><i class="fas fa-chart-line"></i> Reportes</a>
                <a href="#"><i class="fas fa-cog"></i> Configuración</a>
            </nav>
        </aside>

        <main class="content">
            <div class="breadcrumb">Inicio / Usuarios</div>
            
            <section class="table-card">
                <div class="table-header">
                    <h2>Listado de Usuarios</h2>
                    <div class="table-actions">
                        <input type="text" placeholder="Buscar usuario...">
                        <select><option>Todos</option></select>
                        <select><option>Profesor</option></select>
                        <button class="btn-add"><i class="fas fa-plus"></i> Agregar Usuario</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaUsuarios">
                        <tr>
                            <td>1</td>
                            <td>Juan Pérez</td>
                            <td>juan@email.com</td>
                            <td><span class="role student">Estudiante</span></td>
                            <td>
                                <button class="btn-edit"><i class="fas fa-pencil-alt"></i></button>
                                <button class="btn-delete"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="js/usuarios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduAgenda - Iniciar sesión</title>
  <link rel="stylesheet" href="css/colors.css" />
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <img src="icono_grado.jpg" alt="Logo EduAgenda" width="45" />
      <span>EduAgenda</span>
    </div>

    <div class="nav-links">
      <a href="main.html#tabla" class="nav-item" id="btnInicio">Inicio</a>
      <a href="sesion.html" class="nav-item">Iniciar sesión</a>
      <a href="registrate.html" class="btn-register">Registrarse</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Iniciar sesión</h2>

      <label for="loginCorreo">Correo electrónico</label>
      <input type="email" id="loginCorreo" placeholder="Ingresa tu correo" />

      <label for="loginPassword">Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" />

      <button id="btnLogin" type="button">Iniciar sesión</button>
    </div>
  </div>

  <script src="js/inicio.js"></script>
  <script src="js/sesion.js"></script>
</body>
</html>

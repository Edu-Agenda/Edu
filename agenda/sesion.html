<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduAgenda - Iniciar sesión</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/colors.css" />

  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">
      <img src="icono_grado.jpg" alt="Logo EduAgenda" width="45" />
      <span>EduAgenda</span>
    </div>

    <div class="menu">
      <a href="main.html">Inicio</a>
      <a href="sesion.html" class="activo">Iniciar sesión</a>
      <a href="registrate.html">Registrarse</a>
    </div>
  </nav>

  <!-- LOGIN -->
  <div class="container">
    <div class="card">

      <!-- 🔥 ICONO DE USUARIO -->
      <h2><i class="fas fa-user"></i> Iniciar sesión</h2>
      <p class="subtitle">Accede a tu cuenta para continuar</p>

      <!-- CORREO -->
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="loginCorreo" placeholder="Correo electrónico" />
      </div>

      <!-- CONTRASEÑA -->
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Contraseña" />
      </div>

      <!-- BOTÓN CON ICONO -->
      <button id="btnLogin" class="btn">
        <i class="fas fa-user"></i> Iniciar sesión
      </button>

      <!-- LINK -->
      <p class="extra">
        ¿No tienes cuenta?
        <a href="registrate.html">Regístrate aquí</a>
      </p>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer-contact">
    <div class="contact-horizontal">

      <div class="contact-item">
        <i class="fas fa-envelope"></i>
        <p><strong>Email:</strong> soporte@eduagenda.com</p>
      </div>

      <div class="contact-item">
        <i class="fas fa-phone"></i>
        <p><strong>Teléfono:</strong> +57 300 000 0000</p>
      </div>

      <div class="contact-item">
        <i class="fas fa-map-marker-alt"></i>
        <p><strong>Ubicación:</strong> Tumaco, Colombia</p>
      </div>

    </div>

    <p class="copyright">© 2026 EduAgenda</p>
  </footer>

  <!-- JS -->
  <script src="js/inicio.js"></script>
  <script src="js/sesion.js"></script>

</body>

</html>

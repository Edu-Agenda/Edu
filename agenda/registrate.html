<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduAgenda - Registro</title>
  <link rel="stylesheet" href="colors.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">EduAgenda</div>
    <div class="nav-links">
      <a href="main.html#tabla" class="nav-item" id="btnInicio">Inicio</a>
      <a href="sesion.html" class="nav-item">Iniciar Sesión</a>
      <a href="registrate.html" class="btn-register">Regístrate</a>
    </div>
  </nav>

  <!-- REGISTRO -->
  <div class="container">
    <div class="card">
      <h2>Regístrate</h2>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Ingresa tu nombre completo" />

      <label for="documento">Documento</label>
      <input type="text" id="documento" placeholder="Ingresa tu documento" />

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="Ingresa tu correo" />

      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" placeholder="Ingresa tu número" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Crea una contraseña" />

      <button id="btnRegistro" type="button">Registrarse</button>
    </div>
  </div>

  <!-- JS -->
  <script src="js/inicio.js"></script>
  <script src="js/registrarte.js"></script>
</body>
</html>

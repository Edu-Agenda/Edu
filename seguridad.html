<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seguridad - EduAgenda</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f3f4f6;
}

.navbar{
    background:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#111827;
}

.menu{
    display:flex;
    gap:12px;
}

.menu a{
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
}

.salir{
    background:#dc2626 !important;
}

.container{
    width:90%;
    margin:35px auto;
}

.titulo{
    font-size:32px;
    margin-bottom:25px;
    color:#111827;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.card i{
    font-size:30px;
    color:#2563eb;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:12px;
    color:#111827;
}

.card p{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

.input-group{
    margin-top:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#374151;
}

.input-group input,
.input-group select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
}

.btn{
    margin-top:15px;
    background:#16a34a;
    color:white;
    border:none;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.footer{
    margin-top:40px;
    background:white;
    text-align:center;
    padding:20px;
    color:#6b7280;
    border-top:1px solid #e5e7eb;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<i class="fas fa-shield-alt"></i>
Seguridad
</div>

<div class="menu">

<a href="admin.html">
<i class="fas fa-arrow-left"></i>
Volver
</a>

<a href="main.html"
class="salir"
onclick="logout()">
<i class="fas fa-sign-out-alt"></i>
Salir
</a>

</div>

</div>

<!-- CONTENIDO -->

<div class="container">

<h1 class="titulo">
<i class="fas fa-user-lock"></i>
Panel de Seguridad
</h1>

<div class="grid">

<!-- CONTRASEÑA -->

<div class="card">

<i class="fas fa-key"></i>

<h3>Cambiar Contraseña</h3>

<p>

Actualiza la contraseña
del administrador.

</p>

<div class="input-group">

<label>Nueva contraseña</label>

<input
type="password"
id="password">

</div>

<button
class="btn"
onclick="guardarPassword()">

Guardar Contraseña

</button>

</div>

<!-- BLOQUEAR -->

<div class="card">

<i class="fas fa-user-slash"></i>

<h3>Bloquear Usuarios</h3>

<p>

Bloquea accesos de usuarios
del sistema.

</p>

<div class="input-group">

<label>Correo usuario</label>

<input
type="email"
id="correoBloqueado"
placeholder="usuario@gmail.com">

</div>

<button
class="btn"
onclick="bloquearUsuario()">

Bloquear Usuario

</button>

</div>

<!-- SESIONES -->

<div class="card">

<i class="fas fa-laptop-house"></i>

<h3>Sesiones</h3>

<p>

Cerrar sesiones activas
del sistema.

</p>

<button
class="btn"
onclick="cerrarSesiones()">

Cerrar Sesiones

</button>

</div>

</div>

</div>

<!-- FOOTER -->

<footer class="footer">

© 2026 EduAgenda - Seguridad

</footer>

<script>

function guardarPassword(){

    const password =
        document.getElementById('password').value;

    localStorage.setItem(
        'adminPassword',
        password
    );

    alert('Contraseña guardada');

}

function bloquearUsuario(){

    const correo =
        document.getElementById('correoBloqueado').value;

    localStorage.setItem(
        'usuarioBloqueado',
        correo
    );

    alert('Usuario bloqueado');

}

function cerrarSesiones(){

    alert('Sesiones cerradas');

}

function logout(){

    localStorage.clear();

    window.location.href='main.html';

}

</script>

</body>

</html>

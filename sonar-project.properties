# SonarQube configuration for EduAgenda

# Información general del proyecto
sonar.projectKey=Edu
sonar.projectName=Edu
sonar.projectVersion=1.0.0

# Directorio raíz del proyecto
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/tests/**, **/coverage/**, **/screenshots/**, **/*.test.js, robot*.js, **/js/**, **/*.html

# Archivos a incluir para análisis
sonar.inclusions=server.js,db.js,authMiddleware.js

# Lenguaje
sonar.language=js

# Configuración de JavaScript
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Directorio de reportes de cobertura
sonar.coverage.exclusions=**/tests/**, **/node_modules/**, **/*.test.js, robot*.js

# Codificación
sonar.sourceEncoding=UTF-8

# Host de SonarQube (cambia según tu instalación)
# Para SonarQube local:
sonar.host.url=http://localhost:9000

# Para SonarCloud (comentar la línea anterior y descomentar esta):
# sonar.host.url=https://sonarcloud.io
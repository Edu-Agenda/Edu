<!-- =====================================================
     DOCUMENTO HTML5
     Página de configuración administrativa del sistema
     EduAgenda
===================================================== -->
<!DOCTYPE html>

<!-- Idioma principal del sistema -->
<html lang="es">

<head>

    <!-- Configuración de caracteres -->
    <meta charset="UTF-8">

    <!-- Diseño responsive para celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título mostrado en la pestaña -->
    <title>EduAgenda — Configuración Admin</title>

    <!-- =====================================================
         CONEXIÓN CON GOOGLE FONTS
         Importación de tipografías del sistema
    ====================================================== -->

    <!-- Optimización de conexión -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Optimización de carga -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fuentes del sistema -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <style>

        /* =====================================================
           VARIABLES GLOBALES
           Colores reutilizables del sistema
        ====================================================== */
        :root {

            --bg:#F5F3EE;
            --surface:#FDFCF9;
            --border:#E4E0D8;

            --text:#1C1A17;
            --muted:#7A7570;

            --accent:#2B5CE6;
            --accent-light:#EAF0FF;

            --danger:#C0392B;
            --danger-light:#FDF0EE;

            --success:#1A7F4B;
            --success-light:#EAF6EF;

            --warn:#B45309;
            --warn-light:#FEF3C7;
        }

        /* =====================================================
           CONFIGURACIÓN GENERAL
           Elimina márgenes y paddings
        ====================================================== */
        * {

            margin:0;

            padding:0;

            box-sizing:border-box;
        }

        /* =====================================================
           BODY PRINCIPAL
           Define colores y tipografía general
        ====================================================== */
        body {

            font-family:'DM Sans',sans-serif;

            background:var(--bg);

            color:var(--text);

            min-height:100vh;
        }

        /* =====================================================
           NAVBAR PRINCIPAL
           Barra superior de navegación
        ====================================================== */
        nav {

            background:var(--surface);

            border-bottom:1px solid var(--border);

            padding:0 5%;

            display:flex;

            justify-content:space-between;

            align-items:center;

            height:62px;

            position:sticky;

            top:0;

            z-index:100;
        }

        /* =====================================================
           LOGO DEL SISTEMA
        ====================================================== */
        .logo {

            font-family:'DM Serif Display',serif;

            font-size:1.3rem;

            color:var(--text);
        }

        /* =====================================================
           CONTENEDOR DE ENLACES
        ====================================================== */
        .nav-links {

            display:flex;

            gap:2px;

            align-items:center;
        }

        /* =====================================================
           ENLACES DEL MENÚ
        ====================================================== */
        .nav-links a {

            text-decoration:none;

            color:var(--muted);

            font-size:0.875rem;

            padding:6px 14px;

            border-radius:8px;
        }

        /* Hover de enlaces */
        .nav-links a:hover {

            background:var(--bg);

            color:var(--text);
        }

        /* Página activa */
        .nav-links a.active {

            background:var(--accent-light);

            color:var(--accent);
        }

        /* =====================================================
           BOTÓN CERRAR SESIÓN
        ====================================================== */
        .btn-logout {

            padding:7px 16px;

            border-radius:8px;

            border:1px solid #F5C6C2;

            background:var(--danger-light);

            color:var(--danger);

            cursor:pointer;
        }

        /* =====================================================
           CONTENEDOR PRINCIPAL
        ====================================================== */
        .page {

            max-width:1100px;

            margin:0 auto;

            padding:40px 24px 80px;
        }

        /* =====================================================
           TÍTULO PRINCIPAL
        ====================================================== */
        .page-title {

            font-family:'DM Serif Display',serif;

            font-size:2rem;

            margin-bottom:6px;
        }

        /* =====================================================
           SUBTÍTULO
        ====================================================== */
        .page-sub {

            font-size:0.875rem;

            color:var(--muted);

            margin-bottom:36px;
        }

        /* =====================================================
           GRID DE TARJETAS
           Organización de accesos rápidos
        ====================================================== */
        .quick-grid {

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

            gap:14px;

            margin-bottom:36px;
        }

        /* =====================================================
           TARJETAS DE ACCESO
        ====================================================== */
        .quick-card {

            background:var(--surface);

            border:1px solid var(--border);

            border-radius:14px;

            padding:20px 22px;

            cursor:pointer;
        }

        /* Hover de tarjetas */
        .quick-card:hover {

            transform:translateY(-3px);

            border-color:var(--accent);
        }

        /* Tarjeta activa */
        .quick-card.active-panel {

            border-color:var(--accent);

            background:var(--accent-light);
        }

        /* =====================================================
           ICONOS DE TARJETAS
        ====================================================== */
        .quick-icon {

            width:38px;

            height:38px;

            border-radius:10px;

            display:flex;

            align-items:center;

            justify-content:center;

            margin-bottom:12px;
        }

        /* Colores de iconos */
        .quick-icon.blue { background:var(--accent-light); }

        .quick-icon.green { background:var(--success-light); }

        .quick-icon.warn { background:var(--warn-light); }

        .quick-icon.red { background:var(--danger-light); }

        /* =====================================================
           TÍTULOS DE TARJETAS
        ====================================================== */
        .quick-title {

            font-size:0.9rem;

            font-weight:600;

            margin-bottom:4px;
        }

        /* Subtítulos */
        .quick-sub {

            font-size:0.75rem;

            color:var(--muted);
        }

        /* =====================================================
           PANELES DEL SISTEMA
        ====================================================== */
        .panel {

            display:none;

            background:var(--surface);

            border:1px solid var(--border);

            border-radius:16px;

            padding:28px;

            margin-bottom:20px;

            animation:fadeIn 0.2s ease;
        }

        /* Panel visible */
        .panel.open {

            display:block;
        }

        /* =====================================================
           ANIMACIÓN DE APARICIÓN
        ====================================================== */
        @keyframes fadeIn {

            from {

                opacity:0;

                transform:translateY(6px);
            }

            to {

                opacity:1;

                transform:translateY(0);
            }
        }

        /* =====================================================
           TÍTULO DE PANELES
        ====================================================== */
        .panel-title {

            font-size:1.3rem;

            margin-bottom:22px;
        }

        /* =====================================================
           FILAS DE FORMULARIO
        ====================================================== */
        .form-row {

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:16px;
        }

        /* =====================================================
           CAMPOS DEL FORMULARIO
        ====================================================== */
        .field {

            margin-bottom:16px;
        }

        /* Etiquetas */
        .field label {

            display:block;

            font-size:0.78rem;

            margin-bottom:7px;
        }

        /* Inputs y selects */
        .field input,
        .field select {

            width:100%;

            padding:11px 14px;

            border:1px solid var(--border);

            border-radius:11px;
        }

        /* =====================================================
           BOTONES PRINCIPALES
        ====================================================== */
        .btn-primary {

            padding:11px 22px;

            border:none;

            border-radius:11px;

            background:var(--accent);

            color:#fff;

            cursor:pointer;
        }

        /* Hover botón principal */
        .btn-primary:hover {

            background:#2050cc;
        }

        /* =====================================================
           BOTÓN SECUNDARIO
        ====================================================== */
        .btn-secondary {

            padding:11px 18px;

            border:1px solid var(--border);

            border-radius:11px;

            background:none;

            cursor:pointer;
        }

        /* =====================================================
           TABLAS DEL SISTEMA
        ====================================================== */
        table {

            width:100%;

            border-collapse:collapse;
        }

        /* Encabezados */
        th {

            padding:11px 16px;

            text-align:left;
        }

        /* Celdas */
        td {

            padding:14px 16px;

            border-bottom:1px solid var(--border);
        }

        /* =====================================================
           TOAST DE NOTIFICACIONES
        ====================================================== */
        #toast {

            position:fixed;

            bottom:28px;

            right:28px;

            padding:12px 20px;

            border-radius:12px;

            opacity:0;
        }

        /* Toast visible */
        #toast.show {

            opacity:1;
        }

        /* Toast éxito */
        #toast.ok {

            background:var(--success-light);

            color:var(--success);
        }

        /* Toast error */
        #toast.err {

            background:var(--danger-light);

            color:var(--danger);
        }

        /* =====================================================
           RESPONSIVE DESIGN
           Adaptación móvil
        ====================================================== */
        @media(max-width:700px) {

            .form-row {

                grid-template-columns:1fr;
            }

            .nav-links {

                display:none;
            }
        }

    </style>

</head>

<body>

<!-- =====================================================
     BARRA DE NAVEGACIÓN
===================================================== -->
<nav>

    <!-- Logo principal -->
    <div class="logo">

        EduAgenda

    </div>

    <!-- Menú de navegación -->
    <div class="nav-links">

        <!-- Página inicio -->
        <a href="admin.html">Inicio</a>

        <!-- Página reportes -->
        <a href="reportes.html">Reportes</a>

        <!-- Página seguridad -->
        <a href="seguridad.html">Seguridad</a>

        <!-- Página actual -->
        <a href="#" class="active">Configuración</a>

        <!-- Botón cerrar sesión -->
        <button class="btn-logout" onclick="logout()">

            Cerrar sesión

        </button>

    </div>

</nav>
